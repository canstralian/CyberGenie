[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.0",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.2.2",
    "werkzeug>=3.1.3",
    "psycopg2-binary>=2.9.10",
    "email-validator>=2.2.0",
    "transformers>=4.47.0",
    "pyyaml>=6.0.2",
    "torch>=2.5.1",
    "snowflake-connector-python[pandas]>=3.12.4",
    "pyarrow>=14.0.1",
    "pandas>=2.1.3",
    "python-mistralclient>=5.3.0",
]

[tool.flake8]
max-line-length = 88
count = true

[tool.black]
line-length = 88
target-version = ['py38']
skip-string-normalization = true
