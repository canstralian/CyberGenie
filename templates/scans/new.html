{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Start New Scan</h2>
    
    <form method="POST" class="mt-4">
        <div class="mb-3">
            <label for="target_url" class="form-label">Target URL</label>
            <input type="url" class="form-control" id="target_url" name="target_url" 
                   placeholder="https://example.com" required>
            <div class="form-text">Enter the URL you want to scan for vulnerabilities</div>
        </div>
        
        <div class="mb-3">
            <label for="scan_type" class="form-label">Scan Type</label>
            <select class="form-select" id="scan_type" name="scan_type">
                <option value="basic">Basic Scan</option>
                <option value="full">Full Scan</option>
                <option value="api">API Scan</option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary">Start Scan</button>
    </form>
</div>
{% endblock %}
