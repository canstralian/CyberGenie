name: Deploy Production

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install flake8 and pytest
      run: |
        pip install flake8 pytest

    - name: Run linter
      run: flake8 .

    - name: Run tests
      run: pytest

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install pytest
      run: |
        pip install pytest

    - name: Run tests
      run: pytest

  trigger-tests:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
    - name: Trigger existing test workflows
      run: |
        gh workflow run python-app.yml
        gh workflow run python-package.yml
