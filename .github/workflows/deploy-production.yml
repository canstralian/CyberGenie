name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python and install dependencies
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'  # Pinning Python version for consistency

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}  # Optimized cache key to include pyproject.toml
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi  # Install dependencies from pyproject.toml if present

      - name: Deploy to Staging
        run: |
          echo "Deploying to staging..."
          # Example: Deploy to AWS S3 for staging
          aws s3 cp ./myapp s3://mybucket-staging/myapp/ --recursive

      - name: Deploy to Production
        run: |
          echo "Deploying to production..."
          # Example: Deploy to AWS S3 for production
          aws s3 cp ./myapp s3://mybucket-production/myapp/ --recursive

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "Deployment failed. Rolling back to previous version..."
          # Example: Rollback to previous version in AWS S3
          aws s3 cp s3://mybucket-production/myapp-previous/ s3://mybucket-production/myapp/ --recursive

      - name: Use Terraform for Infrastructure Management
        run: |
          echo "Applying infrastructure changes with Terraform..."
          terraform init
          terraform apply -auto-approve
