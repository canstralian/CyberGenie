name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python and install dependencies
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'  # Pinning Python version for consistency

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}  # Optimized cache key to include pyproject.toml
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi  # Install dependencies from pyproject.toml if present

      - name: Deploy to Production
        run: |
          # Add your deployment script here
          echo "Deploying to production..."
          # Example: Deploy to AWS
          # aws s3 cp ./myapp s3://mybucket/myapp/ --recursive
          
        # Optionally, add a condition to stop the deployment if any step fails
        continue-on-error: false  # Default behavior; stops if deployment fails